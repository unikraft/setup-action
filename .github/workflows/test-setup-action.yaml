name: test-setup-action
permissions:
  contents: read

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  setup-action-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Unikraft CLI (default)
        uses: ./
      - name: Capture default version
        shell: bash
        run: |
          unikraft version | tee "${RUNNER_TEMP}/unikraft-version-default.txt"

      - name: Install Unikraft CLI (latest)
        uses: ./
        with:
          version: latest
      - name: Capture latest version
        shell: bash
        run: |
          unikraft version | tee "${RUNNER_TEMP}/unikraft-version-latest.txt"

      - name: Install Unikraft CLI (stable)
        uses: ./
        with:
          version: stable
      - name: Capture stable version
        shell: bash
        run: |
          unikraft version | tee "${RUNNER_TEMP}/unikraft-version-stable.txt"

      - name: Install Unikraft CLI (dev)
        uses: ./
        with:
          version: dev
      - name: Capture dev version
        shell: bash
        run: |
          unikraft version | tee "${RUNNER_TEMP}/unikraft-version-dev.txt"

      - name: Install Unikraft CLI (staging)
        uses: ./
        with:
          version: staging
      - name: Capture staging version
        shell: bash
        run: |
          unikraft version | tee "${RUNNER_TEMP}/unikraft-version-staging.txt"

      - name: Install Unikraft CLI (pinned)
        uses: ./
        with:
          version: 0.2.1
      - name: Capture pinned version
        shell: bash
        run: |
          unikraft version | tee "${RUNNER_TEMP}/unikraft-version-pinned.txt"

      - name: Verify CLI versions
        shell: bash
        run: |
          default_output="$(cat "${RUNNER_TEMP}/unikraft-version-default.txt")"
          latest_output="$(cat "${RUNNER_TEMP}/unikraft-version-latest.txt")"
          stable_output="$(cat "${RUNNER_TEMP}/unikraft-version-stable.txt")"
          dev_output="$(cat "${RUNNER_TEMP}/unikraft-version-dev.txt")"
          staging_output="$(cat "${RUNNER_TEMP}/unikraft-version-staging.txt")"
          pinned_output="$(cat "${RUNNER_TEMP}/unikraft-version-pinned.txt")"

          if [[ -z "${default_output}" || -z "${latest_output}" || -z "${stable_output}" || -z "${dev_output}" || -z "${staging_output}" || -z "${pinned_output}" ]]; then
            echo "One or more version outputs are empty" >&2
            exit 1
          fi

          extract_version() {
            local label="$1"
            local output="$2"
            local version

            version="$(printf '%s\n' "${output}" | awk -F: '/^[[:space:]]*version[[:space:]]*:/ { gsub(/^[[:space:]]+/, "", $2); gsub(/[[:space:]]+$/, "", $2); print $2; exit }')"
            if [[ -z "${version}" ]]; then
              echo "${label} output did not include a version line: ${output}" >&2
              exit 1
            fi

            if [[ ! "${version}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?([+][0-9A-Za-z.-]+)?$ ]]; then
              echo "${label} version has unexpected format: ${version}" >&2
              exit 1
            fi

            printf '%s' "${version}"
          }

          default_version="$(extract_version "Default" "${default_output}")"
          latest_version="$(extract_version "Latest" "${latest_output}")"
          stable_version="$(extract_version "Stable" "${stable_output}")"
          dev_version="$(extract_version "Dev" "${dev_output}")"
          staging_version="$(extract_version "Staging" "${staging_output}")"
          pinned_version="$(extract_version "Pinned" "${pinned_output}")"
          echo "Default version: ${default_version}"
          echo "Latest version:  ${latest_version}"
          echo "Stable version:  ${stable_version}"
          echo "Dev version:     ${dev_version}"
          echo "Staging version: ${staging_version}"
          echo "Pinned version:  ${pinned_version}"

          if [[ "${default_version}" != "${latest_version}" ]]; then
            echo "Expected default and latest versions to match: default=${default_version} latest=${latest_version}" >&2
            exit 1
          fi

          if [[ "${latest_version}" != "${stable_version}" ]]; then
            echo "Expected latest and stable versions to match: latest=${latest_version} stable=${stable_version}" >&2
            exit 1
          fi

          if [[ "${dev_version}" != *-* ]]; then
            echo "Expected dev version to be a prerelease: ${dev_version}" >&2
            exit 1
          fi

          if [[ "${dev_version}" != "${staging_version}" ]]; then
            echo "Expected dev and staging versions to match: dev=${dev_version} staging=${staging_version}" >&2
            exit 1
          fi

          if [[ "${pinned_version}" != *"0.2.1"* ]]; then
            echo "Expected pinned version 0.2.1 in output: ${pinned_output}" >&2
            exit 1
          fi

  setup-action-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Unikraft CLI (login)
        uses: ./
        with:
          version: dev
          token: ${{ secrets.UKC_TOKEN }}
          organization: ${{ secrets.UKC_USER }}
      - name: Verify login with metro list
        shell: bash
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${UKC_TOKEN}" ]]; then
            echo "Skipping login verification: UKC_TOKEN is not set"
            exit 0
          fi
          metros="$(unikraft metro list -oquiet)"
          echo "${metros}"
          if [[ -z "${metros}" ]]; then
            echo "No metros returned from unikraft metro list" >&2
            exit 1
          fi
          while IFS= read -r line; do
            if [[ -z "${line}" ]]; then
              echo "Unexpected empty metro entry" >&2
              exit 1
            fi
          done <<< "${metros}"
